name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Start server (memory DB, simulated payments) and run end-to-end API test
        run: |
          PORT=8080 node server/index.js & sleep 2
          BASE=http://localhost:8080 npm test
