name: Deploy site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        # Served from /<repo-name>/ on github.io, and from / once the custom domain (pbagco.com) is set in Settings → Pages.
        run: |
          export BASE="${{ steps.pages.outputs.base_path }}/"
          echo "Building for BASE=$BASE (${{ steps.pages.outputs.base_url }})"
          npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
